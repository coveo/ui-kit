name: Mirror Playwright Docker Image from Microsoft Container Registry
on:
  push:
    branches: [main]
    paths:
      - '.github/playwright-caching.yml'
permissions:
  contents: read

jobs:
  mirror-playwright-image:
    runs-on: ubuntu-latest
    container: gcr.io/go-containerregistry/crane@sha256:61bc716946c2779e1dc0fb8068d116edf8de10e5402262c17e8e4904ddcc14ac

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      PLAYWRIGHT_VERSION: v1.57.0-noble
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Log in to the GitHub Container registry
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: crane auth login ${{env.registry}} -u ${username} -p ${password}
      - name: Mirror Playwright Docker Image
        run: crane copy mcr.microsoft.com/playwright:${{ env.PLAYWRIGHT_VERSION }} ghcr.io/coveo/ui-kit-playwright:${{ env.PLAYWRIGHT_VERSION }}
