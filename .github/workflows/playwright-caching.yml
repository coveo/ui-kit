name: Mirror Playwright Docker Image from Microsoft Container Registry
on:
  push:
    branches: [main]
    paths:
      - '.github/playwright-caching.yml'
permissions:
  contents: read

jobs:
  mirror-playwright-image:
    runs-on: ubuntu-latest
    container: gcr.io/go-containerregistry/crane@sha256:5ccb3ca884e3890d820fbf5ce4071fa3bb89469a72cc3f0ac7404a99c2a68788

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      PLAYWRIGHT_VERSION: v1.57.0-noble
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Log in to the GitHub Container registry
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: crane auth login ${{env.registry}} -u ${username} -p ${password}
      - name: Mirror Playwright Docker Image
        run: crane copy mcr.microsoft.com/playwright:${{ env.PLAYWRIGHT_VERSION }} ghcr.io/coveo/ui-kit-playwright:${{ env.PLAYWRIGHT_VERSION }}
