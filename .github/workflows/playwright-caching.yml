name: Mirror Playwright Docker Image from Microsoft Container Registry
on:
  push:
    branches: [main]
    paths:
      - '.github/playwright-caching.yml'
permissions:
  contents: read

jobs:
  mirror-playwright-image:
    runs-on: ubuntu-latest
    container: gcr.io/go-containerregistry/crane

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      PLAYWRIGHT_VERSION: v1.57.0-noble
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Log in to the GitHub Container registry
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: crane auth login ${{env.registry}} -u ${username} -p ${password}
      - name: Mirror Playwright Docker Image
        run: crane copy mcr.microsoft.com/playwright:${{ env.PLAYWRIGHT_VERSION }} ghcr.io/coveo/ui-kit-playwright:${{ env.PLAYWRIGHT_VERSION }}
