name: Sync Area Rulesets

on:
  push:
    branches: [main]
    paths: ['.areas/**', '.github/workflows/areas-ruleset-sync.yml']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: push-to-main-workflows

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .areas

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CODE_AREAS_APP_ID }}
          private-key: ${{ secrets.CODE_AREAS_PEM }}

      - uses: coveooss/areas@f8f6f24e80b13e412de4132d81e2c17713b41ca7 # areas@0.2.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          command: ruleset-sync

      # The areas action targets the default branch only, and v3 pull requests need the same area reviewers.
      - name: Apply the area rulesets to v3
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/rulesets" --paginate --jq '.[] | select(.source_type == "Repository" and (.name | startswith("area:"))) | .id')
          for id in $ids; do
            gh api "repos/$REPO/rulesets/$id" \
              --jq '{name, target, enforcement, bypass_actors, rules, conditions: (.conditions | .ref_name.include = ((.ref_name.include + ["refs/heads/v3"]) | unique))}' \
              | gh api --method PUT "repos/$REPO/rulesets/$id" --input - --jq '"\(.name): \(.conditions.ref_name.include | join(", "))"'
          done
