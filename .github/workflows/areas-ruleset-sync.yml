name: Sync Area Rulesets

on:
  push:
    branches: [main]
    paths: ['.areas/**', '.github/workflows/areas-ruleset-sync.yml']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: push-to-main-workflows

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .areas

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CODE_AREAS_APP_ID }}
          private-key: ${{ secrets.CODE_AREAS_PEM }}

      - uses: coveooss/areas@f8f6f24e80b13e412de4132d81e2c17713b41ca7 # areas@0.2.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          command: ruleset-sync

      # The areas action targets the default branch only, and v3 pull requests need the same area reviewers.
      - name: Apply the area rulesets to v3
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const rulesets = await github.paginate(github.rest.repos.getRepoRulesets, {
              ...context.repo,
              includes_parents: false,
            });
            const areaRulesets = rulesets.filter(({name}) => name.startsWith('area:'));

            for (const {id} of areaRulesets) {
              const {data: ruleset} = await github.rest.repos.getRepoRuleset({
                ...context.repo,
                ruleset_id: id,
              });
              const branches = new Set([...ruleset.conditions.ref_name.include, 'refs/heads/v3']);

              await github.rest.repos.updateRepoRuleset({
                ...context.repo,
                ruleset_id: id,
                name: ruleset.name,
                target: ruleset.target,
                enforcement: ruleset.enforcement,
                bypass_actors: ruleset.bypass_actors,
                rules: ruleset.rules,
                conditions: {ref_name: {...ruleset.conditions.ref_name, include: [...branches]}},
              });
              core.info(`${ruleset.name}: ${[...branches].join(', ')}`);
            }
