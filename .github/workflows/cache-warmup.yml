name: Warm dependency caches
# Dependency caches are saved here only. Every other job restores them read-only, so each cache
# flavour (Ubuntu runner, Playwright container, Windows) is written on main instead of once per
# PR ref. The container flavour needs its own job: it runs as user 1001 with a different HOME and
# without zstd, which gives it a cache version that runner jobs can neither read nor write.
# Pull requests that change the setup action warm their own ref to validate it. The schedule
# re-saves anything evicted or invalidated by a runner image update; a full hit saves nothing.
on:
  push:
    branches: [main]
    # The inputs of the cache keys in .github/actions/setup/action.yml.
    paths:
      - pnpm-lock.yaml
      - mise.toml
      - .github/actions/setup/**
      - .github/workflows/cache-warmup.yml
  pull_request:
    paths:
      - .github/actions/setup/**
      - .github/workflows/cache-warmup.yml
  schedule:
    - cron: '17 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: 'Warm caches (Ubuntu runner)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'

  container:
    name: 'Warm caches (Playwright container)'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'

  windows:
    name: 'Warm caches (Windows runner)'
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'
