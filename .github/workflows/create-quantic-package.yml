name: Create Quantic Package

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  create-and-promote-quantic-package:
    environment: 'Quantic Staging'
    name: Create Quantic Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Quantic ships 3.x from v3 until the v4 GA, and a schedule only runs
          # the copy of this workflow on main (KIT-6480).
          ref: refs/heads/v3
      - name: Read the checked-out commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create cache file
        env:
          CHECKOUT_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          mkdir check-SHA
          echo "$CHECKOUT_SHA" > github-sha.txt
      - name: Check SHA
        id: check_sha
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: check-SHA
          key: check-SHA-${{ steps.checkout.outputs.sha }}
      - name: Cancel current workflow run if no changes made
        if: steps.check_sha.outputs.cache-hit == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            })
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build Quantic
        run: pnpm exec turbo run build --filter=@coveo/quantic
      - name: Setup SFDX
        uses: ./.github/actions/setup-sfdx
      - name: Create package version
        working-directory: ./packages/quantic
        run: |
          echo "${{ secrets.SFDX_AUTH_JWT_KEY }}" > ${VARS_SFDX_AUTH_JWT_KEY_FILE}
          pnpm exec ts-node scripts/build/create-package.ts --remove-translations --ci
          rm ${VARS_SFDX_AUTH_JWT_KEY_FILE}
        env:
          SFDX_AUTH_JWT_USERNAME: ${{ vars.SFDX_AUTH_JWT_USERNAME }}
          SFDX_AUTH_JWT_KEY_FILE: ${{ vars.SFDX_AUTH_JWT_KEY_FILE }}
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          VARS_SFDX_AUTH_JWT_KEY_FILE: ${{ vars.SFDX_AUTH_JWT_KEY_FILE }}
