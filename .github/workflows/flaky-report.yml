name: Flaky test report

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/flaky-report.yml'
      - 'utils/ci/flaky-report/**'
      - 'utils/ci/package.json'
      - 'utils/ci/playwright-record-reporter.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled publish could leave the issue without its weekly comment, so only dry runs cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dry-run:
    name: 'Flaky test report (dry run)'
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history, so git blame can date each skipped test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      # Without --publish, the report goes to this job's summary instead of the issue.
      - id: report
        run: pnpm --filter @coveo/ci run flaky-report --snapshot "$RUNNER_TEMP/flaky-snapshot"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Lets a pull request check the snapshot. The dashboard only imports those uploaded from main.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.report.outputs.snapshot }}
          path: ${{ runner.temp }}/flaky-snapshot
          retention-days: 90

  publish:
    name: 'Flaky test report'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history, so git blame can date each skipped test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - id: report
        run: pnpm --filter @coveo/ci run flaky-report --publish --snapshot "$RUNNER_TEMP/flaky-snapshot"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.report.outputs.snapshot }}
          path: ${{ runner.temp }}/flaky-snapshot
          # The flaky test dashboard imports the snapshots of the past 90 days.
          retention-days: 90
