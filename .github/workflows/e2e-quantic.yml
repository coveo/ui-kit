on:
  workflow_call:
    inputs:
      event_name:
        description: 'The event name that triggered the workflow'
        required: false
        type: string
        default: 'pull_request'
    secrets:
      SFDX_AUTH_CLIENT_ID:
        required: true
      SFDX_AUTH_JWT_KEY:
        required: true
      TURBO_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  e2e-quantic-setup:
    name: 'Setup e2e tests on Quantic (LWS-${{ matrix.lws-status }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ inputs.event_name == 'merge_group' }}
      matrix:
        lws-status: ['enabled', 'disabled']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build --filter=@coveo/quantic
      - uses: ./.github/actions/setup-sfdx
      - uses: ./.github/actions/e2e-quantic-setup
        with:
          clientid: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          jwtkey: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          lws-status: ${{ matrix.lws-status }}
  apex-quantic-tests:
    name: 'Run Quantic Apex unit tests'
    needs: e2e-quantic-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: ./.github/actions/setup-sfdx
      - name: Download Apex scratch-org handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quantic-scratch-org-repo-${{ github.repository_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lws-enabled
          path: ${{ runner.temp }}/quantic-scratch-org-handoffs/quantic-scratch-org-repo-${{ github.repository_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lws-enabled
      - name: Authenticate Apex reconciliation to the Salesforce Dev Hub
        id: apex-salesforce-auth
        run: |
          umask 077
          printf '%s\n' "$SFDX_AUTH_JWT_KEY" > "$JWT_KEY_FILE"
          sf org login jwt \
            --client-id "$SFDX_AUTH_CLIENT_ID" \
            --jwt-key-file "$JWT_KEY_FILE" \
            --username "$SFDX_AUTH_JWT_USERNAME" \
            --instance-url https://login.salesforce.com \
            --set-default-dev-hub
        shell: bash
        env:
          JWT_KEY_FILE: ${{ runner.temp }}/quantic-apex-jwt.key
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Validate Apex scratch-org handoff
        id: apex-org
        run: |
          node .github/scripts/quantic-scratch-org-handoff.mjs validate-ready \
            --artifact-directory "$RUNNER_TEMP/quantic-scratch-org-handoffs/quantic-scratch-org-repo-${GITHUB_REPOSITORY_ID}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-lws-enabled" \
            --trusted-root "$RUNNER_TEMP" \
            --lws-status enabled \
            --producer-attempt "$GITHUB_RUN_ATTEMPT" \
            --dev-hub-username "$SFDX_AUTH_JWT_USERNAME" \
            --github-output "$GITHUB_OUTPUT"
        shell: bash
        env:
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Authenticate to authoritative Quantic scratch org
        run: |
          sf org login jwt \
            --client-id "$SFDX_AUTH_CLIENT_ID" \
            --jwt-key-file "$JWT_KEY_FILE" \
            --username "$APEX_ORG_USERNAME" \
            --instance-url https://test.salesforce.com \
            --set-default
        shell: bash
        env:
          APEX_ORG_USERNAME: ${{ steps.apex-org.outputs.username }}
          JWT_KEY_FILE: ${{ runner.temp }}/quantic-apex-jwt.key
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
      - uses: ./.github/actions/apex-unit-tests
        with:
          target-org: ${{ steps.apex-org.outputs.username }}
      - name: Remove Apex authentication material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/quantic-apex-jwt.key"
        shell: bash
  post-scratch-org-links-to-pr:
    name: 'Post Scratch Org Links to PR'
    needs: e2e-quantic-setup
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/post-scratch-org-links-on-pr
  e2e-quantic-playwright-test:
    name: 'Run Playwright e2e tests on Quantic'
    needs: e2e-quantic-setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    strategy:
      fail-fast: ${{ inputs.event_name == 'merge_group' }}
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-quantic
        with:
          shardIndex: ${{ matrix.shardIndex }}
          shardTotal: ${{ matrix.shardTotal }}
  merge-quantic-playwright-reports:
    name: 'Merge Playwright reports'
    environment: PR Artifacts
    if: ${{ !cancelled() }}
    needs:
      - 'e2e-quantic-playwright-test'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Merge Playwright reports
        uses: ./.github/actions/merge-playwright-reports
        with:
          working-directory: packages/quantic
          artifact-pattern: quantic-blob-report-*
          upload-artifact-name: quantic-playwright-report
  e2e-quantic-cleanup:
    if: ${{ cancelled() || failure() || success() }}
    needs:
      - e2e-quantic-setup
      - e2e-quantic-playwright-test
      - apex-quantic-tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: ./.github/actions/setup-sfdx
      - name: Download scratch-org handoffs
        id: download-handoffs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: quantic-scratch-org-repo-${{ github.repository_id }}-run-${{ github.run_id }}-attempt-*-lws-*
          path: ${{ runner.temp }}/quantic-scratch-org-handoffs
      - name: Authenticate cleanup to the Salesforce Dev Hub
        id: cleanup-salesforce-auth
        run: |
          umask 077
          printf '%s\n' "$SFDX_AUTH_JWT_KEY" > "$JWT_KEY_FILE"
          sf org login jwt \
            --client-id "$SFDX_AUTH_CLIENT_ID" \
            --jwt-key-file "$JWT_KEY_FILE" \
            --username "$SFDX_AUTH_JWT_USERNAME" \
            --instance-url https://login.salesforce.com \
            --set-default-dev-hub
        shell: bash
        env:
          JWT_KEY_FILE: ${{ runner.temp }}/quantic-cleanup-jwt.key
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Reconcile cleanup scratch-org handoffs
        id: scratch-orgs
        if: ${{ always() && steps.cleanup-salesforce-auth.outcome == 'success' }}
        run: |
          node .github/scripts/quantic-scratch-org-handoff.mjs validate-cleanup \
            --artifact-root "$RUNNER_TEMP/quantic-scratch-org-handoffs" \
            --trusted-root "$RUNNER_TEMP" \
            --dev-hub-username "$SFDX_AUTH_JWT_USERNAME" \
            --targets-file "$RUNNER_TEMP/quantic-scratch-org-cleanup-targets.json" \
            --github-output "$GITHUB_OUTPUT"
        shell: bash
        env:
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Delete LWS-enabled Quantic scratch org
        if: ${{ always() && steps.scratch-orgs.outcome == 'success' && steps.scratch-orgs.outputs.enabled-target-count != '0' }}
        run: |
          node .github/scripts/quantic-scratch-org-handoff.mjs delete-cleanup \
            --targets-file "$RUNNER_TEMP/quantic-scratch-org-cleanup-targets.json" \
            --trusted-root "$RUNNER_TEMP" \
            --lws-status enabled \
            --dev-hub-username "$SFDX_AUTH_JWT_USERNAME"
        shell: bash
        env:
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY_FILE: ${{ runner.temp }}/quantic-cleanup-jwt.key
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Delete LWS-disabled Quantic scratch org
        if: ${{ always() && steps.scratch-orgs.outcome == 'success' && steps.scratch-orgs.outputs.disabled-target-count != '0' }}
        run: |
          node .github/scripts/quantic-scratch-org-handoff.mjs delete-cleanup \
            --targets-file "$RUNNER_TEMP/quantic-scratch-org-cleanup-targets.json" \
            --trusted-root "$RUNNER_TEMP" \
            --lws-status disabled \
            --dev-hub-username "$SFDX_AUTH_JWT_USERNAME"
        shell: bash
        env:
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY_FILE: ${{ runner.temp }}/quantic-cleanup-jwt.key
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Remove cleanup authentication material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/quantic-cleanup-jwt.key"
        shell: bash
