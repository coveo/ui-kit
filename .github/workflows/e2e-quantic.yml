on:
  workflow_call:
    inputs:
      event_name:
        description: 'The event name that triggered the workflow'
        required: false
        type: string
        default: 'pull_request'
    secrets:
      SFDX_AUTH_CLIENT_ID:
        required: true
      SFDX_AUTH_JWT_KEY:
        required: true
      TURBO_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  e2e-quantic-setup:
    name: 'Setup e2e tests on Quantic (LWS-${{ matrix.lws-status }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ inputs.event_name == 'merge_group' }}
      matrix:
        lws-status: ['enabled', 'disabled']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run @coveo/quantic#build:staticresources
      - uses: ./.github/actions/setup-sfdx
      - uses: ./.github/actions/e2e-quantic-setup
        with:
          clientid: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          jwtkey: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          lws-status: ${{ matrix.lws-status }}
  apex-quantic-tests:
    name: 'Run Quantic Apex unit tests'
    needs: e2e-quantic-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-sfdx
      - name: Resolve Apex target org
        id: apex-org
        run: |
          umask 077
          printf '%s\n' "$SFDX_AUTH_JWT_KEY" > server.key
          trap 'rm -f -- server.key' EXIT
          echo "target-org=$(pnpm exec ts-node scripts/build/resolve-org-username.ts)" >> "$GITHUB_OUTPUT"
        shell: bash
        working-directory: ./packages/quantic
        env:
          COMMIT_SHA: ${{ github.sha }}
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          SFDX_AUTH_JWT_KEY_FILE: server.key
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
      - name: Authenticate to Quantic scratch org
        run: |
          umask 077
          printf '%s\n' "$SFDX_AUTH_JWT_KEY" > server.key
          trap 'rm -f -- server.key' EXIT
          sf org login jwt \
            --client-id "$SFDX_AUTH_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$APEX_ORG_USERNAME" \
            --instance-url https://test.salesforce.com \
            --set-default
        shell: bash
        env:
          APEX_ORG_USERNAME: ${{ steps.apex-org.outputs.target-org }}
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
      - uses: ./.github/actions/apex-unit-tests
        with:
          target-org: ${{ steps.apex-org.outputs.target-org }}
  post-scratch-org-links-to-pr:
    name: 'Post Scratch Org Links to PR'
    needs: e2e-quantic-setup
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/post-scratch-org-links-on-pr
  e2e-quantic-playwright-test:
    name: 'Run Playwright e2e tests on Quantic'
    needs: e2e-quantic-setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: ${{ inputs.event_name == 'merge_group' }}
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6]
        shardTotal: [6]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-quantic
        with:
          shardIndex: ${{ matrix.shardIndex }}
          shardTotal: ${{ matrix.shardTotal }}
  merge-quantic-playwright-reports:
    name: 'Merge Playwright reports'
    environment: PR Artifacts
    if: ${{ !cancelled() }}
    needs:
      - 'e2e-quantic-playwright-test'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Merge Playwright reports
        uses: ./.github/actions/merge-playwright-reports
        with:
          working-directory: packages/quantic
          artifact-pattern: quantic-blob-report-*
          upload-artifact-name: quantic-playwright-report
  e2e-quantic-cleanup:
    if: cancelled() || failure() || success()
    needs:
      - e2e-quantic-playwright-test
      - apex-quantic-tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-sfdx
      - name: Delete Quantic scratch orgs
        run: |
          umask 077
          printf '%s\n' "$SFDX_AUTH_JWT_KEY" > server.key
          trap 'rm -f -- server.key' EXIT
          pnpm exec ts-node scripts/build/delete-org.ts
        shell: bash
        working-directory: ./packages/quantic
        env:
          COMMIT_SHA: ${{ github.sha }}
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          SFDX_AUTH_JWT_KEY_FILE: server.key
          SFDX_AUTH_JWT_USERNAME: rdaccess@coveo.com
