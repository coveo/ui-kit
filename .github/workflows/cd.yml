name: Create release
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ⚠️ INVARIANT: this job publishes to npm and does NOTHING else.
  #
  # Every other concern — the release/v3 bookmark, Sentry source maps, Quantic
  # promotion, typedoc, docs, the CDN dispatch — lives in its own job that depends
  # on this one. That is deliberate and load-bearing: it is what makes
  # "`release` succeeded" mean exactly "npm was published to", so a failure in
  # unrelated post-release work can never suppress the CDN deployment.
  #
  # It used to be otherwise. In run 31519447241 a post-publish telemetry step
  # (`Read create-ui version`) failed after `changeset publish` had already pushed
  # to npm, which failed the whole job and skipped `Upload commit artifacts to S3`.
  # The published version got no CDN folder and returned 403 indefinitely, because
  # a later release only ever writes its own version folders. That is how
  # @coveo/atomic 3.59.3 through 3.60.6 reached npm but never reached the CDN.
  #
  # Do not add steps here. Add a job.
  release:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: coveo
          repositories: 'ui-kit'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: ./.github/actions/setup
      - name: Create release PR or publish
        id: changesets
        continue-on-error: true
        uses: step-security/changeset-action@6ddf46283ed49170eb6ca2179818f7d2a0ae687c # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm run release
          title: 'ci(changesets): version packages j:KIT-5605'
          commit: 'ci(changesets): version packages j:KIT-5605'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      # A partial publish is deliberately NOT a failure: some packages reached npm,
      # so downstream jobs must still run. Only a publish that made zero progress
      # fails this job, and in that case nothing is on npm and there is no gap.
      - name: Fail if publishing made no progress
        if: ${{ steps.changesets.outcome == 'failure' && steps.changesets.outputs.published != 'true' }}
        run: |
          echo "The publish command failed before any package was published." >&2
          exit 1

  # The release/v3 tag is a human-facing bookmark for "what was last released".
  # It is no longer load-bearing: the jobs that used to check it out now use the
  # release commit directly, which is what `github.sha` already is on a push to
  # main. Keep it that way — reintroducing a dependency on this tag would make
  # every downstream job wait on, and fail with, a bookkeeping step.
  release-bookmark:
    name: Update release/v3 bookmark
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: coveo
          repositories: 'ui-kit'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - name: Move the bookmark to the released commit
        run: |
          git tag -f release/v3
          git push origin refs/tags/release/v3 --force

  create-ui-sentry:
    name: Upload create-ui source maps to Sentry
    needs: release
    if: ${{ needs.release.outputs.published == 'true' && contains(needs.release.outputs.publishedPackages, '@coveo/create-ui') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      # The source maps used to come for free from the build that `pnpm run release`
      # ran in the release job. Rebuilding here keeps this job independent; the
      # Turbo remote cache makes it a restore rather than a real build.
      - name: Build create-ui
        run: pnpm exec turbo run build --filter=@coveo/create-ui
      - name: Read create-ui version
        id: create-ui-version
        run: echo "version=$(jq -r '.version' packages/create-ui/package.json)" >> "$GITHUB_OUTPUT"
      - name: Upload source maps
        continue-on-error: true
        uses: step-security/getsentry-action-release@4530160f6bc962e1dd67e2703064a7a5cfd401fb # v3.7.0
        with:
          release: create-ui@${{ steps.create-ui-version.outputs.version }}
          sourcemaps: packages/create-ui/dist
          url_prefix: app:///dist
          inject: false
          set_commits: skip
          disable_telemetry: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: coveo-platform
          SENTRY_PROJECT: create-ui

  quantic-prod:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: 'Quantic Production'
    permissions:
      contents: read
      packages: write
      discussions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # The default checkout is `github.sha`, which on a push to main IS the
      # released commit: `changeset version` ran in the Version Packages PR, so
      # package.json already carries the published versions. Do not reintroduce
      # `ref: refs/tags/release/v3` — it would make this job depend on a
      # bookkeeping step it has no reason to wait for.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-sfdx
      - name: Promote SFDX package to production
        run: |
          echo "${{ secrets.SFDX_AUTH_JWT_KEY }}" > ${VARS_SFDX_AUTH_JWT_KEY_FILE}
          pnpm exec turbo run @coveo/quantic#promote:sfdx:ci
          rm ${VARS_SFDX_AUTH_JWT_KEY_FILE}
        env:
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          SFDX_AUTH_JWT_USERNAME: ${{ vars.SFDX_AUTH_JWT_USERNAME }}
          SFDX_AUTH_JWT_KEY_FILE: ${{ vars.SFDX_AUTH_JWT_KEY_FILE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARS_SFDX_AUTH_JWT_KEY_FILE: ${{ vars.SFDX_AUTH_JWT_KEY_FILE }}
        working-directory: ./packages/quantic
  typedoc-headless:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Checks out `github.sha`, the released commit. See the note in quantic-prod.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up and build the project
        uses: ./.github/actions/setup

      - name: Build typedoc site
        run: pnpm exec turbo run build:typedoc --filter=@coveo/headless
        shell: bash

      - name: Read version from package.json
        id: read_version
        run: |
          VERSION=$(jq -r '.version' packages/headless/package.json)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Copy the docs into the version folder
        run: |
          mkdir -p typedoc-headless-site/${version}/
          cp -r packages/headless/docs/* typedoc-headless-site/${version}/
          echo "Copied docs to: typedoc-headless-site/${version}/"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-docs-${{ env.version }}
          path: typedoc-headless-site/
  typedoc-headless-react:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Checks out `github.sha`, the released commit. See the note in quantic-prod.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up and build the project
        uses: ./.github/actions/setup

      - name: Build typedoc site
        run: pnpm exec turbo run build:typedoc --filter=@coveo/headless-react
        shell: bash

      - name: Read version from package.json
        id: read_version
        run: |
          VERSION=$(jq -r '.version' packages/headless-react/package.json)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Copy the docs into the version folder
        run: |
          mkdir -p typedoc-headless-react-site/${version}/
          cp -r packages/headless-react/docs/* typedoc-headless-react-site/${version}/
          echo "Copied docs to: typedoc-headless-react-site/${version}/"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-react-docs-${{ env.version }}
          path: typedoc-headless-react-site/
  docs-prod:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: 'Docs Production'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Checks out `github.sha`, the released commit. See the note in quantic-prod.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Create GitHub App token for docs dispatch
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.DOC_APP_ID }}
          private-key: ${{ secrets.DOC_APP_PRIVATE_KEY }}
          owner: coveo
          repositories: doc_jekyll-public-site
      - name: Notify Docs
        continue-on-error: true
        run: pnpm run notify:docs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
  build-cdn:
    name: Build CDN
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-cdn
        with:
          commit-sha: ${{ github.sha }}
  commit-artifact-upload:
    name: Upload commit artifacts to S3
    needs: [build-cdn, release]
    # Kept as `always()` on purpose, as defence in depth rather than the primary
    # fix. The primary fix is the `release` job's invariant: it publishes and does
    # nothing else, so it can only fail when the publish made zero progress, which
    # means nothing reached npm and there is no CDN gap to create. If someone ever
    # breaks that invariant by adding post-publish work back into `release`, this
    # condition is what keeps the CDN deployment from being skipped.
    #
    # `build-cdn` stays a hard gate: it is the same build ui-kit-cd will run, so a
    # red one means the deployment cannot succeed anyway.
    if: ${{ always() && needs.build-cdn.result == 'success' && needs.release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # TODO(KIT-5712): Rename to 'CDN Deploy' once token vending machine is available
    environment: 'Prerelease (CDN)'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Trigger commit artifact upload on ui-kit-cd
        run: node ./scripts/deploy/trigger-commit-upload.mjs
        env:
          GH_TOKEN: ${{ secrets.UI_KIT_CD_DISPATCHER }}
          # Comma-separated list of CDN channels to update (e.g. "private" or "private,preview").
          # On release commits, update both private and preview pointers.
          # On regular merges, only update private pointers.
          #
          # ⚠️ `published` is only 'true' on the run that actually publishes. If you
          # re-run ALL jobs of a release run, `release` re-runs, finds no pending
          # changesets, and `published` flips to 'false' — this silently degrades to
          # `private`, which never writes version folders, and the run goes green.
          # To recover a release run, re-run FAILED jobs only, or use the
          # `Redeploy CDN` workflow.
          CHANNELS: ${{ needs.release.outputs.published == 'true' && 'private,preview' || 'private' }}

  # Turns "npm published but the CDN was never told" into a red run with a runbook,
  # instead of a half-green release nobody notices. This checks only that the
  # dispatch was sent; ui-kit-cd reports its own deployment failures to Slack.
  cdn-signal-guard:
    name: Verify the CDN was notified of the release
    needs: [release, commit-artifact-upload]
    if: ${{ always() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Fail if the CDN deployment was never dispatched
        if: ${{ needs.commit-artifact-upload.result != 'success' }}
        run: |
          {
            echo "## Release published to npm, but the CDN was not notified"
            echo
            echo "\`commit-artifact-upload\` finished as \`${{ needs.commit-artifact-upload.result }}\`."
            echo "The published version has no CDN folder and will return 403 until this is fixed."
            echo "A later release will NOT heal it: releases only write their own version folders."
            echo
            echo "### Recovery"
            echo
            echo "Run the **Redeploy CDN** workflow with:"
            echo
            echo "- \`ref\`: \`${{ github.sha }}\`"
            echo "- \`channels\`: \`private,preview\`"
            echo
            echo "Then approve the \`cdn-stable\` gate in coveo-platform/ui-kit-cd."
            echo
            echo "Alternatively, re-run **failed jobs only** on this run."
            echo "Do NOT re-run all jobs: \`release\` would find no changesets, \`published\`"
            echo "would flip to 'false', and the dispatch would degrade to the \`private\`"
            echo "channel, which never writes version folders."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "npm published but the CDN deployment was not dispatched. See the job summary." >&2
          exit 1

  chromatic-update-main:
    name: 'Update Chromatic baseline on main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - name: Update Chromatic baseline
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          autoAcceptChanges: true
          branchName: main
          exitZeroOnChanges: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/atomic
