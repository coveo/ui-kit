name: Create release
on:
  push:
    branches: [main, v3]

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ⚠️  Keep this job limited to publishing and tagging.
  #
  # A failing step here fails the whole job, and anything that runs after the
  # publish step then never happens. Post-release side work (source maps,
  # notifications) belongs in its own job below, so that it cannot take the
  # release down with it.
  #
  # Until the v4 GA, main publishes only the packages outside the Changesets
  # `ignore` list. The 3.x releases, the release/v3 tag and the CDN, Quantic
  # and docs deploys run from the copy of this workflow on the v3 branch
  # (KIT-6480).
  release:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      publishedPackages: ${{ steps.changesets.outputs['published-packages'] }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: coveo
          repositories: 'ui-kit'
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: ./.github/actions/setup
      - name: Hold back the changesets of the paused packages
        # Changesets keeps the changesets of the packages in its ignore list
        # until the v4 GA, and the changeset action publishes only when it finds
        # no changeset file. When nothing else is left to version, remove them
        # from this checkout so that the action publishes: publishing commits
        # nothing, so they stay in the repository.
        run: |
          to_version=$(node utils/ci/changeset-files.mjs --to-version)
          held=$(node utils/ci/changeset-files.mjs --held)
          if [ -z "$to_version" ] && [ -n "$held" ]; then
            echo "Nothing to version. Removed from this checkout until the v4 GA:"
            echo "$held"
            echo "$held" | xargs rm --
          fi
      - name: Create release PR or publish
        id: changesets
        continue-on-error: true
        uses: step-security/changeset-action@facd91fb9caf5c417d1a2b13e5e1d740899722da # v2.1.2
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          version-script: pnpm exec turbo run create-version
          publish-script: pnpm run release
          pr-title: 'ci(changesets): version packages (${{ github.ref_name }}) j:KIT-5605'
          commit-message: 'ci(changesets): version packages (${{ github.ref_name }}) j:KIT-5605'
      - name: Fail if publishing made no progress
        if: ${{ steps.changesets.outcome == 'failure' && steps.changesets.outputs.published != 'true' }}
        run: |
          echo "The publish command failed before any package was published." >&2
          exit 1
  sentry-create-ui:
    name: Upload create-ui source maps to Sentry
    needs: release
    if: ${{ contains(needs.release.outputs.publishedPackages, '@coveo/create-ui') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Build create-ui
        run: pnpm exec turbo run build --filter=@coveo/create-ui
      - name: Read create-ui version
        id: create-ui-version
        working-directory: packages/create-ui
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
      - name: Upload source maps
        uses: step-security/getsentry-action-release@29b3cd3ba6037bc74216eb5a0ce9639941d15917 # v3.7.2
        with:
          release: create-ui@${{ steps.create-ui-version.outputs.version }}
          sourcemaps: packages/create-ui/dist
          url_prefix: app:///dist
          inject: false
          set_commits: skip
          disable_telemetry: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: coveo-platform
          SENTRY_PROJECT: create-ui
  chromatic-update-baseline:
    name: 'Update the Chromatic baseline of this branch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Chromatic needs full history to update the branch baseline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - name: Update Chromatic baseline
        uses: chromaui/action@6efa19d4a40404313897de5a6d516e0333a2a787 # v18.14.5
        with:
          autoAcceptChanges: true
          branchName: ${{ github.ref_name }}
          exitZeroOnChanges: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/atomic
