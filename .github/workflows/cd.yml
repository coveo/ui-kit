name: Create release
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  release:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: coveo
          repositories: 'ui-kit'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: ./.github/actions/setup
      - name: Create release PR or publish
        id: changesets
        continue-on-error: true
        uses: step-security/changeset-action@6ddf46283ed49170eb6ca2179818f7d2a0ae687c # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm run release
          title: 'ci(changesets): version packages j:KIT-5605'
          commit: 'ci(changesets): version packages j:KIT-5605'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Fail if publishing made no progress
        if: ${{ steps.changesets.outcome == 'failure' && steps.changesets.outputs.published != 'true' }}
        run: |
          echo "The publish command failed before any package was published." >&2
          exit 1
      - name: Read create-ui version
        id: create-ui-version
        if: ${{ steps.changesets.outputs.published == 'true' && contains(steps.changesets.outputs.publishedPackages, '@coveo/create-ui') }}
        working-directory: packages/create-ui
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Upload create-ui source maps to Sentry
        if: ${{ steps.changesets.outputs.published == 'true' && contains(steps.changesets.outputs.publishedPackages, '@coveo/create-ui') }}
        uses: step-security/getsentry-action-release@4530160f6bc962e1dd67e2703064a7a5cfd401fb # v3.7.0
        with:
          release: create-ui@${{ steps.create-ui-version.outputs.version }}
          sourcemaps: packages/create-ui/dist
          url_prefix: app:///dist
          inject: false
          set_commits: skip
          disable_telemetry: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: coveo-platform
          SENTRY_PROJECT: create-ui
      - name: Update release/v3 bookmark
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: |
          git tag -f release/v3
          git push origin refs/tags/release/v3 --force
  quantic-prod:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: 'Quantic Production'
    permissions:
      contents: read
      packages: write
      discussions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 'refs/tags/release/v3'
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-sfdx
      - name: Promote SFDX package to production
        run: |
          echo "${{ secrets.SFDX_AUTH_JWT_KEY }}" > ${VARS_SFDX_AUTH_JWT_KEY_FILE}
          pnpm exec turbo run @coveo/quantic#promote:sfdx:ci
          rm ${VARS_SFDX_AUTH_JWT_KEY_FILE}
        env:
          SFDX_AUTH_CLIENT_ID: ${{ secrets.SFDX_AUTH_CLIENT_ID }}
          SFDX_AUTH_JWT_KEY: ${{ secrets.SFDX_AUTH_JWT_KEY }}
          SFDX_AUTH_JWT_USERNAME: ${{ vars.SFDX_AUTH_JWT_USERNAME }}
          SFDX_AUTH_JWT_KEY_FILE: ${{ vars.SFDX_AUTH_JWT_KEY_FILE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARS_SFDX_AUTH_JWT_KEY_FILE: ${{ vars.SFDX_AUTH_JWT_KEY_FILE }}
        working-directory: ./packages/quantic
  typedoc-headless:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 'refs/tags/release/v3'

      - name: Set up and build the project
        uses: ./.github/actions/setup

      - name: Build typedoc site
        run: pnpm run build:typedoc
        working-directory: packages/headless
        shell: bash

      - name: Read version from package.json
        id: read_version
        run: |
          VERSION=$(jq -r '.version' packages/headless/package.json)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Copy the docs into the version folder
        run: |
          mkdir -p typedoc-headless-site/${version}/
          cp -r packages/headless/docs/* typedoc-headless-site/${version}/
          echo "Copied docs to: typedoc-headless-site/${version}/"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-docs-${{ env.version }}
          path: typedoc-headless-site/
  typedoc-headless-react:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 'refs/tags/release/v3'

      - name: Set up and build the project
        uses: ./.github/actions/setup

      - name: Build typedoc site
        run: pnpm run build:typedoc
        working-directory: packages/headless-react
        shell: bash

      - name: Read version from package.json
        id: read_version
        run: |
          VERSION=$(jq -r '.version' packages/headless-react/package.json)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Copy the docs into the version folder
        run: |
          mkdir -p typedoc-headless-react-site/${version}/
          cp -r packages/headless-react/docs/* typedoc-headless-react-site/${version}/
          echo "Copied docs to: typedoc-headless-react-site/${version}/"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-react-docs-${{ env.version }}
          path: typedoc-headless-react-site/
  docs-prod:
    if: ${{ needs.release.outputs.published == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: 'Docs Production'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 'refs/tags/release/v3'
      - uses: ./.github/actions/setup
      - name: Create GitHub App token for docs dispatch
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.DOC_APP_ID }}
          private-key: ${{ secrets.DOC_APP_PRIVATE_KEY }}
          owner: coveo
          repositories: doc_jekyll-public-site
      - name: Notify Docs
        continue-on-error: true
        run: pnpm run notify:docs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
  build-cdn:
    name: Build CDN
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-cdn
        with:
          commit-sha: ${{ github.sha }}
  commit-artifact-upload:
    name: Upload commit artifacts to S3
    needs: [build-cdn, release]
    runs-on: ubuntu-latest
    # TODO(KIT-5712): Rename to 'CDN Deploy' once token vending machine is available
    environment: 'Prerelease (CDN)'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
        with:
          skip-build: 'true'
      - name: Trigger commit artifact upload on ui-kit-cd
        run: node ./scripts/deploy/trigger-commit-upload.mjs
        env:
          GH_TOKEN: ${{ secrets.UI_KIT_CD_DISPATCHER }}
          # Comma-separated list of CDN channels to update (e.g. "private" or "private,preview").
          # On release commits, update both private and preview pointers.
          # On regular merges, only update private pointers.
          CHANNELS: ${{ needs.release.outputs.published == 'true' && 'private,preview' || 'private' }}
  chromatic-update-main:
    name: 'Update Chromatic baseline on main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          load-cache: 'false'
      - name: Update Chromatic baseline
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          autoAcceptChanges: true
          branchName: main
          exitZeroOnChanges: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/atomic
