name: Build CDN
description: Build with CDN deployment environment

inputs:
  commit-sha:
    description: 'Commit SHA for self-contained CDN artifacts. External dependencies resolve to /package/commits/<SHA>/ paths instead of version-based paths.'
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - run: pnpm exec turbo build --filter='!./samples/**'
      # Samples are not CDN artifacts. Exclude them so the CDN build does not try
      # to bundle samples that depend on CDN-externalized packages.
      env:
        DEPLOYMENT_ENVIRONMENT: CDN
        CDN_COMMIT_SHA: ${{ inputs.commit-sha }}
