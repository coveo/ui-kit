name: Apex Unit Tests
description: Run Quantic Apex unit tests against an existing scratch org.
inputs:
  target-org:
    description: Existing Salesforce org alias to run the Apex tests against
    required: true
runs:
  using: composite
  steps:
    - name: Run Apex unit tests
      run: |
        mkdir -p test-results
        sf apex run test --target-org "$INPUTS_TARGET_ORG" --test-level RunLocalTests --result-format junit --wait 30 > test-results/apex.xml
      shell: bash
      working-directory: packages/quantic
      env:
        INPUTS_TARGET_ORG: ${{ inputs.target-org }}
