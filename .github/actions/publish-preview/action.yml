name: Publish preview packages
description: Publish affected public packages to pkg.pr.new.
inputs:
  affected-tasks:
    description: Affected Turbo task identifiers as a JSON array.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve preview templates
      shell: bash
      run: |
        # The directories published as StackBlitz templates, so a reviewer gets a
        # live app per preview. Declared once here and consumed by both the
        # catalog-flattening step and the publish step, so the two cannot disagree
        # about what counts as a template.
        #
        # A single brace pattern rather than repeated `--template` flags:
        # pkg-pr-new declares `--template` as a string and expands it with glob, so
        # one value is unambiguously correct, whereas repeating the flag would rely
        # on the CLI collapsing duplicates into an array.
        {
          echo 'PREVIEW_TEMPLATE_PATTERN={packages/pkg-new-template,samples/thermidor/demo-schema-react}'
        } >> "$GITHUB_ENV"
    - name: Resolve preview package paths
      id: resolve
      shell: bash
      env:
        AFFECTED_TASKS: ${{ inputs.affected-tasks }}
      run: |
        package_paths="$(node "$GITHUB_ACTION_PATH/resolve-packages.mjs")"
        {
          echo 'packages<<EOF'
          echo "$package_paths"
          echo EOF
        } >> "$GITHUB_OUTPUT"
    - name: Build
      if: ${{ steps.resolve.outputs.packages != '' }}
      shell: bash
      env:
        PACKAGE_PATHS: ${{ steps.resolve.outputs.packages }}
      run: |
        filters=()
        while IFS= read -r package_path; do
          [[ -z "$package_path" ]] || filters+=("--filter=${package_path}")
        done <<< "$PACKAGE_PATHS"

        pnpm exec turbo run build "${filters[@]}"
    - name: Prepare pkg.pr.new templates
      if: ${{ steps.resolve.outputs.packages != '' }}
      shell: bash
      run: node packages/pkg-new-template/scripts/prepare-templates.mjs "$PREVIEW_TEMPLATE_PATTERN"
    - name: Publish to pkg.pr.new
      if: ${{ steps.resolve.outputs.packages != '' }}
      shell: bash
      env:
        PACKAGE_PATHS: ${{ steps.resolve.outputs.packages }}
      run: |
        package_paths=()
        while IFS= read -r package_path; do
          [[ -z "$package_path" ]] || package_paths+=("$package_path")
        done <<< "$PACKAGE_PATHS"

        pnpm dlx pkg-pr-new publish --pnpm \
          --template "$PREVIEW_TEMPLATE_PATTERN" \
          "${package_paths[@]}"
