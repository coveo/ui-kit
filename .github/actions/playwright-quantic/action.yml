name: 'Quantic Playwright E2E tests'
description: 'Runs Playwright tests for Quantic'
inputs:
  shardIndex:
    description: 'The shard index to run'
    required: true
  shardTotal:
    description: 'The total number of shards'
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: quantic-playwright-env-*
        path: packages/quantic/.env
        merge-multiple: true
    # The shard goes through TEST_SHARD, which only the test task hashes. Turbo hashes
    # `turbo run … -- --shard=N/M` into every task of the run, which would stop the shards
    # from replaying the dependencies the setup job and the other shards already built.
    - name: Run Playwright Tests
      run: pnpm exec turbo run @coveo/quantic#e2e:pre-provisioned
      shell: bash
      env:
        TEST_SHARD: ${{ inputs.shardIndex }}/${{ inputs.shardTotal }}
    - name: Upload blob report to GitHub Actions Artifacts
      if: cancelled() || failure() || success()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: quantic-blob-report-${{ matrix.shardIndex }}
        path: packages/quantic/blob-report
        retention-days: 5
    - name: Upload the Playwright record
      if: ${{ !cancelled() }}
      uses: ./.github/actions/upload-playwright-record
