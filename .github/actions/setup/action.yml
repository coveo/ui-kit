#region Metadata
name: 'Setup & build'
description: 'Setup node, install dependencies & build'
inputs:
  skip-build:
    description: 'Skip the build step'
    required: false
    default: 'false'
  build-command:
    description: 'Command used to build. Defaults to building every package.'
    required: false
    default: 'pnpm run build'
#endregion
runs:
  using: composite
  steps:
    #region PNPM
    # pnpm dependencies are cached by setup-node (cache: 'pnpm').
    # Turbo build outputs come from Turborepo remote caching (turbo.json remoteCache + TURBO_TOKEN).
    - name: Install pnpm
      uses: step-security/action-setup@3d419c73e38e670dbffe349ffff26dd13c164640 # v4.2.0
      with:
        run_install: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
    #endregion
    #region Build
    - run: ${{ inputs.build-command }}
      if: inputs.skip-build != 'true'
      shell: bash
    #endregion
