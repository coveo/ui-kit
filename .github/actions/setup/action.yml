#region Metadata
name: 'Setup'
description: 'Setup node and install dependencies'
inputs:
  save-cache:
    description: >-
      Save the pnpm store and mise caches when they were not restored. Only the cache warm-up
      workflow on main enables this; CI jobs stay read-only so the repository keeps a single
      copy of each cache instead of one per PR ref.
    required: false
    default: 'false'
#endregion
runs:
  using: composite
  steps:
    #region Mise (Node + pnpm)
    - name: Install tools via mise
      uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4
      with:
        version: 2026.9.2
        install: true
        cache: true
        cache_save: ${{ inputs.save-cache }}
    - name: Get pnpm store directory
      id: pnpm-store
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
    - name: Save pnpm store
      if: ${{ inputs.save-cache == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
    #endregion
