#region Metadata
name: 'Setup & build'
description: 'Setup node, install dependencies & build'
inputs:
  skip-build:
    description: 'Skip the build step'
    required: false
    default: 'false'
  build-command:
    description: 'Command used to build. Defaults to building every package.'
    required: false
    default: 'pnpm run build --affected'
#endregion
runs:
  using: composite
  steps:
    #region Mise (Node + pnpm)
    - name: Install tools via mise
      uses: step-security/mise-action@2796166110dee826668caddd4bffedae5116e7cd # v4
      with:
        install: true
        cache: true
    - name: Get pnpm store directory
      id: pnpm-store
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
    #endregion
    #region Build
    # Turbo build outputs come from Turborepo remote caching (turbo.json remoteCache + TURBO_TOKEN).
    - run: ${{ inputs.build-command }}
      if: inputs.skip-build != 'true'
      shell: bash
    #endregion
