<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic playground</title>
    <link rel="icon" href="data:," />
    <script type="module" src="./search.js"></script>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <atomic-search-interface language-assets-path="/lang" icon-assets-path="/assets">
      <atomic-search-layout>
        <atomic-layout-section section="search">
          <atomic-search-box clear-recent-button-position="bottom">
            <atomic-search-box-recent-queries></atomic-search-box-recent-queries>
            <atomic-search-box-query-suggestions></atomic-search-box-query-suggestions>
            <atomic-search-box-instant-results>
              <atomic-result-template>
                <template>
                  <atomic-result-section-visual>
                    <atomic-result-icon></atomic-result-icon>
                  </atomic-result-section-visual>
                  <atomic-result-section-title>
                    <atomic-result-link></atomic-result-link>
                  </atomic-result-section-title>
                  <atomic-result-section-title-metadata>
                    <atomic-result-printable-uri
                      max-number-of-parts="3"
                    ></atomic-result-printable-uri>
                  </atomic-result-section-title-metadata>
                </template>
              </atomic-result-template>
            </atomic-search-box-instant-results>
          </atomic-search-box>
        </atomic-layout-section>
        <atomic-layout-section section="main">
          <atomic-layout-section section="results">
            <atomic-result-list></atomic-result-list>
          </atomic-layout-section>
        </atomic-layout-section>
      </atomic-search-layout>
    </atomic-search-interface>
  </body>
</html>
