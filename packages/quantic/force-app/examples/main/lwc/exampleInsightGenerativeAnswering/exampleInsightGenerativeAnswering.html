<template>
  <div class="slds-text-heading_large">{pageTitle}</div>
  <div class="slds-text-longform slds-var-m-top_large">{pageDescription}</div>

  <div class="slds-grid slds-wrap slds-gutters_direct slds-m-top_large">
    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
      <c-quantic-card-container title="Configuration">
        <div class="slds-card__body_inner">
          <c-configurator options={options} ontryitnow={handleTryItNow}>
          </c-configurator>
        </div>
      </c-quantic-card-container>

      <div class="slds-m-vertical_large">
        <a href="/examples">Return to examples</a>
      </div>
    </div>
    <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
      <template if:true={isConfigured}>
        <c-quantic-card-container title="Preview">
          <div class="slds-card__body_inner slds-p-top_small insight-panel__container">
      <c-quantic-demo-insight-interface
        engine-id={engineId}
        access-token={config.accessToken}
        organization-id={config.organizationId}
        insight-id={config.insightId}
        environment={config.environment}
        analytics-mode={config.analyticsMode}
        search-hub={config.searchHub}
        pipeline={config.pipeline}
      >
        <c-quantic-aria-live></c-quantic-aria-live>
        <div
          class="insight-panel_layout slds-is-relative slds-grid_align-center slds-box"
        >
          <div
            class="insight-panel_header slds-var-p-horizontal_medium slds-var-p-bottom_x-small slds-var-p-top_medium slds-theme_shade"
          >
            <div class="slds-grid">
              <div class="slds-grow">
                <c-quantic-search-box
                  without-submit-button
                  engine-id={engineId}
                  textarea
                ></c-quantic-search-box>
              </div>

              <div class="slds-var-p-left_x-small">
                <c-quantic-refine-toggle
                  engine-id={engineId}
                  hide-sort
                  title="Filters"
                >
                  <div slot="refine-title">
                    <div class="slds-align_absolute-center">
                      <lightning-icon
                        class="slds-var-p-right_xx-small"
                        icon-name="utility:filterList"
                        alternative-text="Filters"
                        size="x-small"
                        title="Filters"
                      >
                      </lightning-icon>
                      <span class="slds-text-title_bold">Filters</span>
                    </div>
                  </div>
                  <div slot="button-content">
                    <lightning-icon
                      size="x-small"
                      icon-name="utility:filterList"
                      alternative-text="Filters"
                      class="slds-var-p-vertical_x-small"
                    >
                    </lightning-icon>
                  </div>
                </c-quantic-refine-toggle>
              </div>
            </div>
          </div>

          <c-quantic-facet-manager engine-id={engineId}>
            <c-quantic-facet
              field="objecttype"
              label="Type"
              engine-id={engineId}
            ></c-quantic-facet>
            <c-quantic-facet
              display-values-as="link"
              field="filetype"
              label="File Type"
              engine-id={engineId}
            ></c-quantic-facet>
            <c-quantic-numeric-facet
              field="ytlikecount"
              label="Youtube Likes"
              with-input="integer"
              engine-id={engineId}
            ></c-quantic-numeric-facet>
            <c-quantic-timeframe-facet
              engine-id={engineId}
              field="date"
              label="Date"
              with-date-picker
            >
              <c-quantic-timeframe unit="week"></c-quantic-timeframe>
              <c-quantic-timeframe unit="month"></c-quantic-timeframe>
              <c-quantic-timeframe
                amount="6"
                unit="month"
              ></c-quantic-timeframe>
              <c-quantic-timeframe unit="year"></c-quantic-timeframe>
            </c-quantic-timeframe-facet>
            <c-quantic-category-facet
              with-search
              field="geographicalhierarchy"
              label="Country"
              engine-id={engineId}
            ></c-quantic-category-facet>
          </c-quantic-facet-manager>

          <div class="insight-panel_tabs slds-var-p-horizontal_medium">
            <c-quantic-tab-bar light-theme>
              <c-quantic-tab
                name="All"
                label="All"
                engine-id={engineId}
                is-active
              ></c-quantic-tab>
              <c-quantic-tab
                name="Articles"
                label="Articles"
                expression="@sfkbid"
                engine-id={engineId}
              ></c-quantic-tab>
              <c-quantic-tab
                name="Issues"
                label="Issues"
                expression='@jisourcetype AND NOT @jidocumenttype="WorkLog"'
                engine-id={engineId}
              ></c-quantic-tab>
              <c-quantic-tab
                name="Community"
                label="Community"
                expression='@objecttype=="Message"'
                engine-id={engineId}
              ></c-quantic-tab>
              <c-quantic-tab
                name="Files"
                label="Files"
                expression="@boxdocumenttype==File OR @spcontenttype==Document"
                engine-id={engineId}
              ></c-quantic-tab>
            </c-quantic-tab-bar>
          </div>

          <div class="slds-grid slds-var-p-horizontal_medium slds-var-p-top_small">
            <div class="slds-grow">
              <c-quantic-insight-summary engine-id={engineId}></c-quantic-insight-summary>
            </div>
          </div>

          <div class="slds-var-p-horizontal_medium slds-var-p-vertical_xx-small">
            <c-quantic-generated-answer
              engine-id={engineId}
              agent-id={config.agentId}
              answer-configuration-id={config.answerConfigurationId}
            >
            </c-quantic-generated-answer>
          </div>

          <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium insight-panel_body">
            <c-quantic-query-error engine-id={engineId}></c-quantic-query-error>
            <c-quantic-did-you-mean engine-id={engineId}></c-quantic-did-you-mean>
            <c-quantic-no-results
              engine-id={engineId}
              disable-cancel-last-action
            ></c-quantic-no-results>
            <c-quantic-folded-result-list
              engine-id={engineId}
            ></c-quantic-folded-result-list>
          </div>

          <div class="insight-panel_pager slds-var-p-vertical_medium">
            <c-quantic-pager engine-id={engineId}></c-quantic-pager>
            <c-quantic-results-per-page
              initial-choice="5"
              choices-displayed="5"
              engine-id={engineId}
            >
            </c-quantic-results-per-page>
          </div>
        </div>
      </c-quantic-demo-insight-interface>
          </div>
        </c-quantic-card-container>
      </template>
    </div>
  </div>
</template>
