description: Commerce features in Headless
file_patterns:
  - packages/headless/commerce/**
  - packages/headless/src/**/commerce/**
  - packages/headless/src/app/commerce-engine/**
  - packages/headless/src/state/commerce-app-state.ts
  - packages/headless/src/commerce.index.ts
  - packages/headless/src/test/**commerce**

reviewers:
  commerce-routemasters: ~
  dxui: ~

review_bypass:
  # Renovate @ Coveo (GitHub App id 245330). Dependency PRs are gated on
  # green CI instead of a DXUI review.
  integration/245330: pull_request
