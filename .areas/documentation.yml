description: Documentation and Storybook stories
file_patterns:
  - 'packages/documentation/**'
  - 'packages/**/*.mdx'
  - 'packages/**/*.md'
  - 'packages/**/typedoc.json'
  - 'packages/**/*.typedoc.json'
  - 'packages/**/*.stories.tsx'
reviewers:
  dev-writers: ~
  dxui: ~

review_bypass:
  # Renovate @ Coveo (installation id 30846434). Dependency PRs are gated on
  # green CI instead of a DXUI review.
  integration/30846434: pull_request
