description: Root configuration files and CI/CD infrastructure
file_patterns:
  # Root configuration files
  - CODEOWNERS
  - knip.jsonc
  - package.json
  - renovate.json5
  - tsconfig.json
  - turbo.json
  - vitest.config.js

  # CI/CD infrastructure
  - patches/**
  - scripts/**
  - utils/**

  # New packages
  - .areas/*
  - packages/*

reviewers:
  dxui:
    minimum_approvals: 1

review_bypass:
  # Renovate @ Coveo (GitHub App id 245330). Dependency PRs are gated on
  # green CI instead of a DXUI review.
  integration/245330: pull_request
