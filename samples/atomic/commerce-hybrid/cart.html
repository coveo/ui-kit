<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Atomic + Headless Hybrid Sample — Cart</title>
  </head>
  <body>
    <a class="skip-link" href="#maincontent">Skip to main content</a>
    <header class="app-header">
      <div class="brand">
        <img src="/coveo-logo.svg" alt="Coveo" width="119" height="30" />
        <h1>Atomic + Headless hybrid</h1>
      </div>
      <nav class="app-nav" aria-label="Main">
        <a href="/index.html">Home</a>
        <a href="/search.html">Search</a>
        <mini-cart></mini-cart>
      </nav>
    </header>

    <main id="maincontent" class="cart-page">
      <h2 class="page-title">Cart</h2>
      <p class="page-note">
        The cart is Headless. The recommendations below it are a standard Atomic list on the cart
        slot, refreshed by the page whenever the cart changes.
      </p>

      <!-- Headless: Atomic has no cart component. -->
      <cart-view></cart-view>

      <section class="cart-page__recs">
        <atomic-commerce-recommendation-interface>
          <atomic-commerce-recommendation-list
            slot-id="d8118c04-ff59-4f03-baca-2fc5f3b81221"
            products-per-page="4"
            display="grid"
          >
            <atomic-product-template>
              <!-- Customized: cards open this sample's product page instead of the catalog URL. -->
              <template slot="link">
                <atomic-product-link
                  href-template="/product.html?id=${permanentid}"
                ></atomic-product-link>
              </template>
              <template>
                <atomic-product-section-visual>
                  <atomic-product-field-condition if-defined="ec_thumbnails">
                    <atomic-product-image field="ec_thumbnails"></atomic-product-image>
                  </atomic-product-field-condition>
                </atomic-product-section-visual>
                <atomic-product-section-name>
                  <atomic-product-link
                    href-template="/product.html?id=${permanentid}"
                  ></atomic-product-link>
                </atomic-product-section-name>
                <atomic-product-section-emphasized>
                  <atomic-product-price currency="USD"></atomic-product-price>
                </atomic-product-section-emphasized>
                <atomic-product-section-actions>
                  <add-to-cart-button></add-to-cart-button>
                </atomic-product-section-actions>
              </template>
            </atomic-product-template>
          </atomic-commerce-recommendation-list>
        </atomic-commerce-recommendation-interface>
      </section>
    </main>

    <script type="module" src="/src/cart-page.ts"></script>
  </body>
</html>
