<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Atomic + Headless Hybrid Sample — Product</title>
  </head>
  <body>
    <a class="skip-link" href="#maincontent">Skip to main content</a>
    <header class="app-header">
      <div class="brand">
        <img src="/coveo-logo.svg" alt="Coveo" width="119" height="30" />
        <h1>Atomic + Headless hybrid</h1>
      </div>
      <nav class="app-nav" aria-label="Main">
        <a href="/index.html">Home</a>
        <a href="/search.html">Search</a>
        <mini-cart></mini-cart>
      </nav>
    </header>

    <main id="maincontent" class="product-page">
      <p class="page-note">
        Atomic has no product-page support. The product view event, the badges, and the add-to-cart
        button are Headless; the recommendations are a standard Atomic list scoped to this product.
      </p>

      <article class="product-page__product" aria-labelledby="product-name">
        <img
          id="product-image"
          class="product-page__image"
          alt=""
          width="320"
          height="320"
          hidden
        />
        <div class="product-page__details">
          <h2 id="product-name" class="product-page__name">Loading…</h2>
          <!-- Headless: badges configured in the Merchandising Hub. -->
          <product-badges placement-ids="70b493b2-a1f1-4049-ad70-16695cef39cd"></product-badges>
          <p id="product-price" class="product-page__price"></p>
          <!-- Headless: the same element as in the product cards, initialized by the page. -->
          <add-to-cart-button></add-to-cart-button>
        </div>
      </article>

      <section class="product-page__recs">
        <atomic-commerce-recommendation-interface>
          <!-- `product-id` is set by the page script from the product being viewed. -->
          <atomic-commerce-recommendation-list
            slot-id="ff5d8804-d398-4dd5-b68c-6a729c66454b"
            products-per-page="4"
            display="grid"
          >
            <atomic-product-template>
              <!-- Customized: cards open this sample's product page instead of the catalog URL. -->
              <template slot="link">
                <atomic-product-link
                  href-template="/product.html?id=${permanentid}"
                ></atomic-product-link>
              </template>
              <template>
                <atomic-product-section-visual>
                  <atomic-product-field-condition if-defined="ec_thumbnails">
                    <atomic-product-image field="ec_thumbnails"></atomic-product-image>
                  </atomic-product-field-condition>
                </atomic-product-section-visual>
                <atomic-product-section-name>
                  <atomic-product-link
                    href-template="/product.html?id=${permanentid}"
                  ></atomic-product-link>
                </atomic-product-section-name>
                <atomic-product-section-emphasized>
                  <atomic-product-price currency="USD"></atomic-product-price>
                </atomic-product-section-emphasized>
                <atomic-product-section-actions>
                  <add-to-cart-button></add-to-cart-button>
                </atomic-product-section-actions>
              </template>
            </atomic-product-template>
          </atomic-commerce-recommendation-list>
        </atomic-commerce-recommendation-interface>
      </section>
    </main>

    <script type="module" src="/src/product-page.ts"></script>
  </body>
</html>
