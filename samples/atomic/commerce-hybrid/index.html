<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Atomic + Headless Hybrid Sample — Home</title>
  </head>
  <body>
    <a class="skip-link" href="#maincontent">Skip to main content</a>
    <header class="app-header">
      <div class="brand">
        <img src="/coveo-logo.svg" alt="Coveo" width="119" height="30" />
        <h1>Atomic + Headless hybrid</h1>
      </div>
      <nav class="app-nav">
        <a href="/index.html" aria-current="page">Home</a>
        <a href="/search.html">Search</a>
        <a href="/listing-pants.html">Pants</a>
        <a href="/listing-toys.html">Toys</a>
      </nav>
    </header>

    <main id="maincontent" class="home">
      <section class="home-hero">
        <p class="page-note">
          The same custom search box, in standalone mode: submitting stores the query and navigates
          to the search page instead of searching here. It needs no
          <code>atomic-commerce-interface</code> of its own.
        </p>
        <!--
          A standalone search box renders no products, so there is nothing for an
          Atomic interface to own on this part of the page. The box is bound
          straight to the engine.
        -->
        <hybrid-search-box
          id="hybrid-standalone-search-box"
          redirection-url="/search.html"
          label="Search products"
          placeholder="Search products"
        ></hybrid-search-box>
      </section>

      <section class="home-recs">
        <h2 class="page-title">Recommended for you</h2>
        <atomic-commerce-recommendation-interface>
          <atomic-commerce-recommendation-list
            slot-id="af4fb7ba-6641-4b67-9cf9-be67e9f30174"
            products-per-page="4"
          >
            <atomic-product-template>
              <template>
                <atomic-product-section-visual>
                  <atomic-product-field-condition if-defined="ec_thumbnails">
                    <atomic-product-image field="ec_thumbnails"></atomic-product-image>
                  </atomic-product-field-condition>
                </atomic-product-section-visual>
                <atomic-product-section-name>
                  <atomic-product-link></atomic-product-link>
                </atomic-product-section-name>
                <atomic-product-section-emphasized>
                  <atomic-product-price currency="USD"></atomic-product-price>
                </atomic-product-section-emphasized>
              </template>
            </atomic-product-template>
          </atomic-commerce-recommendation-list>

          <atomic-commerce-recommendation-list
            slot-id="d73afbd2-8521-4ee6-a9b8-31f064721e73"
            products-per-page="4"
          >
            <atomic-product-template>
              <template>
                <atomic-product-section-visual>
                  <atomic-product-field-condition if-defined="ec_thumbnails">
                    <atomic-product-image field="ec_thumbnails"></atomic-product-image>
                  </atomic-product-field-condition>
                </atomic-product-section-visual>
                <atomic-product-section-name>
                  <atomic-product-link></atomic-product-link>
                </atomic-product-section-name>
                <atomic-product-section-emphasized>
                  <atomic-product-price currency="USD"></atomic-product-price>
                </atomic-product-section-emphasized>
              </template>
            </atomic-product-template>
          </atomic-commerce-recommendation-list>
        </atomic-commerce-recommendation-interface>
      </section>
    </main>

    <script type="module" src="/src/home-page.js"></script>
  </body>
</html>
