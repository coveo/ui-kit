<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Atomic + Headless Hybrid Sample — Search</title>
  </head>
  <body>
    <a class="skip-link" href="#maincontent">Skip to main content</a>
    <header class="app-header">
      <div class="brand">
        <img src="/coveo-logo.svg" alt="Coveo" width="119" height="30" />
        <h1>Atomic + Headless hybrid</h1>
      </div>
      <nav class="app-nav" aria-label="Main">
        <a href="/index.html">Home</a>
        <a href="/search.html" aria-current="page">Search</a>
        <!-- Headless: Atomic has no cart component. -->
        <mini-cart></mini-cart>
      </nav>
    </header>

    <main id="maincontent">
      <p class="page-note">
        A standard Atomic search page. The only Headless piece is the add-to-cart button inside each
        product card: Atomic has no cart component, so the storefront is extended rather than
        anything being replaced.
      </p>

      <atomic-commerce-interface type="search">
        <atomic-commerce-layout>
          <atomic-layout-section section="search">
            <atomic-commerce-search-box></atomic-commerce-search-box>
          </atomic-layout-section>

          <atomic-layout-section section="facets">
            <atomic-commerce-facets></atomic-commerce-facets>
          </atomic-layout-section>

          <atomic-layout-section section="main">
            <atomic-layout-section section="status">
              <atomic-commerce-breadbox></atomic-commerce-breadbox>
              <atomic-commerce-query-summary></atomic-commerce-query-summary>
              <atomic-commerce-sort-dropdown></atomic-commerce-sort-dropdown>
            </atomic-layout-section>

            <atomic-layout-section section="products">
              <atomic-commerce-product-list display="grid" density="compact" image-size="small">
                <atomic-product-template>
                  <!-- Customized: cards open this sample's product page instead of the catalog URL. -->
                  <template slot="link">
                    <atomic-product-link
                      href-template="/product.html?id=${permanentid}"
                    ></atomic-product-link>
                  </template>
                  <template>
                    <atomic-product-section-visual>
                      <atomic-product-field-condition if-defined="ec_thumbnails">
                        <atomic-product-image field="ec_thumbnails"></atomic-product-image>
                      </atomic-product-field-condition>
                    </atomic-product-section-visual>
                    <atomic-product-section-name>
                      <atomic-product-link
                        href-template="/product.html?id=${permanentid}"
                      ></atomic-product-link>
                    </atomic-product-section-name>
                    <atomic-product-section-metadata>
                      <atomic-product-field-condition if-defined="ec_brand">
                        <atomic-product-text field="ec_brand"></atomic-product-text>
                      </atomic-product-field-condition>
                      <atomic-product-rating field="ec_rating"></atomic-product-rating>
                    </atomic-product-section-metadata>
                    <atomic-product-section-emphasized>
                      <atomic-product-price currency="USD"></atomic-product-price>
                    </atomic-product-section-emphasized>
                    <atomic-product-section-actions>
                      <!-- Headless, inside an Atomic card. -->
                      <add-to-cart-button></add-to-cart-button>
                    </atomic-product-section-actions>
                  </template>
                </atomic-product-template>
              </atomic-commerce-product-list>
            </atomic-layout-section>

            <atomic-layout-section section="pagination">
              <atomic-commerce-pager></atomic-commerce-pager>
            </atomic-layout-section>
          </atomic-layout-section>
        </atomic-commerce-layout>
      </atomic-commerce-interface>
    </main>

    <script type="module" src="/src/search-page.ts"></script>
  </body>
</html>
